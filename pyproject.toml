[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2audiobook"
version = "0.1.0"
description = "Convert PDF books into chapter-based MP3 audiobooks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typer>=0.12,<1", "pydantic>=2.7,<3", "rich>=13,<15", "PyMuPDF>=1.24,<2", "mutagen>=1.47,<2", "numpy>=1.26,<3", "httpx>=0.27,<1"]

[project.optional-dependencies]
kitten = ["kittentts"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
pdf2audiobook = "pdf2audiobook.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
