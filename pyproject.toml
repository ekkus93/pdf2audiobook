[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2audiobook"
version = "0.1.0"
description = "Convert PDF books into chapter-based MP3 audiobooks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typer>=0.12,<1", "pydantic>=2.7,<3", "rich>=13,<15", "PyMuPDF>=1.24,<2", "mutagen>=1.47,<2", "numpy>=1.26,<3", "httpx>=0.27,<1"]

[project.optional-dependencies]
kitten = ["kittenml"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "mypy>=1.10,<2"]

[project.scripts]
pdf2audiobook = "pdf2audiobook.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# First enforced typed boundary: persisted schema and domain error contracts.
# Keep this scope explicit; P0.01b remains open until every runtime module
# participates in static type checking.
[tool.mypy]
python_version = "3.11"
files = [
    "src/pdf2audiobook/models.py",
    "src/pdf2audiobook/errors.py",
    "src/pdf2audiobook/workspace.py",
    "src/pdf2audiobook/logging.py",
    "src/pdf2audiobook/config.py",
    "src/pdf2audiobook/reading_order.py",
    "src/pdf2audiobook/llm/budget.py",
    "src/pdf2audiobook/llm/cache.py",
    "src/pdf2audiobook/tts/__init__.py",
    "src/pdf2audiobook/document/structure.py",
    "src/pdf2audiobook/special_material.py",
    "src/pdf2audiobook/audio/__init__.py",
    "src/pdf2audiobook/llm/smoke.py",
    "src/pdf2audiobook/pdf.py",
    "src/pdf2audiobook/pipeline.py",
]
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
