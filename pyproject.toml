[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2audiobook"
version = "0.1.0"
description = "Convert PDF books into chapter-based MP3 audiobooks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typer>=0.12,<1", "pydantic>=2.7,<3", "rich>=13,<15", "PyMuPDF>=1.24,<2", "mutagen>=1.47,<2", "numpy>=1.26,<3", "httpx>=0.27,<1", "tqdm>=4.66,<5"]

[project.optional-dependencies]
kitten = ["kittenml>=0.9.4,<0.10"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "mypy>=1.10,<2", "types-tqdm>=4.66,<5"]

[project.scripts]
pdf2audiobook = "pdf2audiobook.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# Explicitly type-check every runtime Python module, including package entry
# points and the main LLM adapter.
[tool.mypy]
python_version = "3.11"
files = [
    "src/pdf2audiobook/__init__.py",
    "src/pdf2audiobook/document/__init__.py",
    "src/pdf2audiobook/llm/__init__.py",
    "src/pdf2audiobook/models.py",
    "src/pdf2audiobook/errors.py",
    "src/pdf2audiobook/workspace.py",
    "src/pdf2audiobook/jsonio.py",
    "src/pdf2audiobook/chapter_artifacts.py",
    "src/pdf2audiobook/chapter_recovery.py",
    "src/pdf2audiobook/edit_review.py",
    "src/pdf2audiobook/chapter_selection.py",
    "src/pdf2audiobook/conversion.py",
    "src/pdf2audiobook/analysis_state.py",
    "src/pdf2audiobook/review_transaction.py",
    "src/pdf2audiobook/logging.py",
    "src/pdf2audiobook/progress_display.py",
    "src/pdf2audiobook/config.py",
    "src/pdf2audiobook/reading_order.py",
    "src/pdf2audiobook/llm/budget.py",
    "src/pdf2audiobook/llm/cache.py",
    "src/pdf2audiobook/tts/__init__.py",
    "src/pdf2audiobook/tts/selection.py",
    "src/pdf2audiobook/document/structure.py",
    "src/pdf2audiobook/document/pagination.py",
    "src/pdf2audiobook/document/listing.py",
    "src/pdf2audiobook/document/coverage.py",
    "src/pdf2audiobook/document/narration.py",
    "src/pdf2audiobook/special_material.py",
    "src/pdf2audiobook/narration.py",
    "src/pdf2audiobook/audio/__init__.py",
    "src/pdf2audiobook/audio/freshness.py",
    "src/pdf2audiobook/audio/encoding.py",
    "src/pdf2audiobook/audio/citations.py",
    "src/pdf2audiobook/audio/progress.py",
    "src/pdf2audiobook/llm/smoke.py",
    "src/pdf2audiobook/pdf.py",
    "src/pdf2audiobook/pipeline.py",
    "src/pdf2audiobook/cli.py",
    "src/pdf2audiobook/llm/vision.py",
    "src/pdf2audiobook/llm/provider.py",
    "src/pdf2audiobook/llm/advisory_common.py",
    "src/pdf2audiobook/llm/structure.py",
    "src/pdf2audiobook/llm/usage.py",
    "src/pdf2audiobook/review_ui.py",
    "src/pdf2audiobook/review_reasons.py",
]
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
