[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2audiobook"
version = "0.1.0"
description = "Convert PDF books into chapter-based MP3 audiobooks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typer>=0.12,<1", "pydantic>=2.7,<3", "rich>=13,<15", "PyMuPDF>=1.24,<2", "mutagen>=1.47,<2", "numpy>=1.26,<3", "httpx>=0.27,<1", "tqdm>=4.66,<5"]

[project.optional-dependencies]
kitten = ["kittenml==0.9.6"]
# Optional speech recognizers for `verify-audio` (docs/PDF2AUDIOBOOK_AUDIO_VERIFICATION_SPEC.md §12).
asr-whisper = ["openai-whisper==20250625"]
asr-wav2vec2 = ["transformers>=4.40,<6", "torch>=2.4,<3"]
asr-vosk = ["vosk==0.3.45"]
asr = ["pdf2audiobook[asr-whisper,asr-wav2vec2,asr-vosk]"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "mypy>=1.10,<2", "types-tqdm>=4.66,<5", "jsonschema>=4.23,<5"]

[project.scripts]
pdf2audiobook = "pdf2audiobook.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pdf2audiobook = ["tts/kitten2_manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
# desktop/ is the Tauri app (Rust and TypeScript), checked by its own tools.
extend-exclude = ["desktop"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# Explicitly type-check every runtime Python module, including package entry
# points and the main LLM adapter.
[tool.mypy]
python_version = "3.11"
