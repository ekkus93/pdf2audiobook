# Optional ASR backends (the asr-* extras): not installed where mypy runs in CI.
[[tool.mypy.overrides]]
module = ["torch", "torch.*", "whisper", "whisper.*", "transformers", "transformers.*", "vosk"]
ignore_missing_imports = true
