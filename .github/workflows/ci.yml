name: Python CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Install FFmpeg for chapter MP3 acceptance tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Create uv environment and install project
        run: uv sync --extra dev
      - name: Lint
        run: uv run --extra dev ruff check .
      - name: Unit tests
        run: uv run --extra dev pytest -q
      - name: CLI smoke
        run: |
          uv run --extra dev pdf2audiobook --help
          uv run --extra dev pdf2audiobook config show --json
          uv run --extra dev pdf2audiobook doctor --json
