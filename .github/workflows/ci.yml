name: Python CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "${{ matrix.python-version }}"
      - name: Install FFmpeg for chapter MP3 acceptance tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg tesseract-ocr tesseract-ocr-eng
      - name: Create uv environment and install project
        run: uv sync --extra dev
      - name: Lint
        run: uv run --extra dev ruff check .
      - name: Scoped Ruff format check
        run: uv run --extra dev ruff format --check src/pdf2audiobook/errors.py tests/test_equation_review.py
      - name: Schema and error type checks
        run: uv run --extra dev mypy --python-version "${{ matrix.python-version }}"
      - name: Unit tests
        run: uv run --extra dev pytest -q
      - name: CLI smoke
        run: |
          uv run --extra dev pdf2audiobook --help
          uv run --extra dev pdf2audiobook config show --json
          uv run --extra dev pdf2audiobook doctor --json
      - name: Installed wheel and source distribution clean environment smoke
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/pdf2audiobook-wheelhouse"
          uv build --sdist --out-dir "$RUNNER_TEMP/pdf2audiobook-wheelhouse"
          uv venv --python "${{ matrix.python-version }}" "$RUNNER_TEMP/pdf2audiobook-fresh"
          uv pip install --python "$RUNNER_TEMP/pdf2audiobook-fresh/bin/python" "$RUNNER_TEMP"/pdf2audiobook-wheelhouse/pdf2audiobook-*.whl
          (
            cd "$RUNNER_TEMP"
            "$RUNNER_TEMP/pdf2audiobook-fresh/bin/python" -c 'import pdf2audiobook; from pdf2audiobook.cli import app; assert app is not None'
            "$RUNNER_TEMP/pdf2audiobook-fresh/bin/pdf2audiobook" --help
            "$RUNNER_TEMP/pdf2audiobook-fresh/bin/pdf2audiobook" config show --no-config --json
            "$RUNNER_TEMP/pdf2audiobook-fresh/bin/pdf2audiobook" doctor --no-config --json
          )
          uv venv --python "${{ matrix.python-version }}" "$RUNNER_TEMP/pdf2audiobook-fresh-sdist"
          uv pip install --python "$RUNNER_TEMP/pdf2audiobook-fresh-sdist/bin/python" "$RUNNER_TEMP"/pdf2audiobook-wheelhouse/pdf2audiobook-*.tar.gz
          (
            cd "$RUNNER_TEMP"
            "$RUNNER_TEMP/pdf2audiobook-fresh-sdist/bin/python" -c 'import pdf2audiobook; from pdf2audiobook.cli import app; assert app is not None'
            "$RUNNER_TEMP/pdf2audiobook-fresh-sdist/bin/pdf2audiobook" --help
            "$RUNNER_TEMP/pdf2audiobook-fresh-sdist/bin/pdf2audiobook" doctor --no-config --json
          )
